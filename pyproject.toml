[project]
name = "topaz-us"
version = "0.1.0"
description = "Local NASDAQ 100 trend-quality research dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests==2.32.3",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pandas==3.0.1",
  "numpy==2.2.3",
  "yfinance==0.2.66",
  "pyarrow==22.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
